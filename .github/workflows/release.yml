name: Release

on:
  push:
    tags:
      - "v*"

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Validate and package Windows x64
    runs-on: windows-2025
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate release tag
        id: version
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          if ($tag -notmatch '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') {
            throw "Release tag '$tag' must use the form vMAJOR.MINOR.PATCH."
          }

          $version = $tag.Substring(1)
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Output "Release version: $version"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Stamp release version
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          npm pkg set "version=$env:RELEASE_VERSION"
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

          "APP_VERSION=$env:RELEASE_VERSION" >> $env:GITHUB_ENV

      - name: Build Windows portable executable and ZIP
        run: npm run dist:win

      - name: Generate SHA-256 checksums
        shell: pwsh
        run: |
          $portable = @(Get-ChildItem -Path dist -Filter '*-windows-x64-portable.exe' -File)
          $archive = @(Get-ChildItem -Path dist -Filter '*-windows-x64.zip' -File)

          if ($portable.Count -ne 1) {
            throw "Expected exactly one portable EXE in dist, found $($portable.Count)."
          }
          if ($archive.Count -ne 1) {
            throw "Expected exactly one Windows ZIP in dist, found $($archive.Count)."
          }

          $assets = @($portable[0], $archive[0]) | Sort-Object Name
          $lines = foreach ($asset in $assets) {
            $hash = (Get-FileHash -LiteralPath $asset.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash *$($asset.Name)"
          }

          $checksumPath = Join-Path (Resolve-Path dist) 'SHA256SUMS.txt'
          $checksumContent = ($lines -join "`n") + "`n"
          [System.IO.File]::WriteAllText(
            $checksumPath,
            $checksumContent,
            [System.Text.UTF8Encoding]::new($false)
          )

          Get-Content -LiteralPath $checksumPath

      - name: Upload validated release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets-${{ steps.version.outputs.version }}
          path: |
            dist/*-windows-x64-portable.exe
            dist/*-windows-x64.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download validated release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets-${{ needs.build.outputs.version }}
          path: release-assets

      - name: Verify SHA-256 checksums
        working-directory: release-assets
        run: sha256sum --check SHA256SUMS.txt

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            release-assets/*-windows-x64-portable.exe \
            release-assets/*-windows-x64.zip \
            release-assets/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --title "osu!lazer Library Manager $GITHUB_REF_NAME"
